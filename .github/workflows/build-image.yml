name: build-image

# Build per-arch OCI images on native runners, then merge them into one
# multi-arch index on GHCR.
#
# The amd64 leg runs on ubuntu-latest. The arm64 leg runs on GitHub's ARM
# runner, so no arch compiles under QEMU.
#
# Each leg pushes only to a per-arch scratch ref (latest-amd64 / latest-arm64).
# The merge job combines those refs into the real tags (version, major.minor,
# latest) with `docker buildx imagetools create`.
#
# Do not push the same final tags from two parallel legs. The registry replaces
# a tag on push, it does not merge. That race lost the arm64 image on every
# previous release; the merge job exists to avoid it.
#
# Provenance and SBOM attestations are disabled. Attestation manifests carry
# platform unknown/unknown, and GHCR shows them in the architecture column.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name, lowercased for GHCR
        id: img
        # GitHub preserves repository-name case; Docker image names must
        # be lowercase. bash lowercases the owner/repo.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.img.outputs.image }}
          # Labels only. The merge job owns the real tags.
          tags: |
            type=raw,value=latest-${{ matrix.arch }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # One platform per leg; each runner builds its own natively.
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.img.outputs.image }}:latest-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          # Per-arch scope: the two legs write their caches concurrently.
          cache-from: type=gha,scope=subtidal-${{ matrix.arch }}
          cache-to: type=gha,scope=subtidal-${{ matrix.arch }},mode=max

  merge:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name, lowercased for GHCR
        id: img
        # GitHub preserves repository-name case; Docker image names must
        # be lowercase. bash lowercases the owner/repo.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.img.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Merge per-arch images into one index
        run: |
          set -euo pipefail
          image="${{ steps.img.outputs.image }}"
          args=()
          while IFS= read -r t; do
            [ -n "$t" ] && args+=("-t" "$t")
          done <<< "${{ steps.meta.outputs.tags }}"
          docker buildx imagetools create "${args[@]}" \
            "${image}:latest-amd64" \
            "${image}:latest-arm64"
