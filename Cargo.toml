[package]
name = "HighTide"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
warp = { version = "0.4.3", features = ["server"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1.0.145"
