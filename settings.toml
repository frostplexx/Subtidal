# Example settings. The real file lives at
#   $XDG_CONFIG_HOME/subtidal/settings.toml
# (or ~/.config/subtidal/settings.toml), or wherever you point to with
# `subtidal --config <path>`. APP_* env vars override individual values,
# eg. APP_PASSWORD=x.

username = "admin"
password = "admin"
port = 8000

# Exponential backoff on failed logins (2s, 4s, 8s, ... per client IP).
# Off by default: behind a reverse proxy every client shares one IP, so
# an attacker can lock out everyone.
rate_limit = false

# Optional: override the embedded Tidal app credentials.
# tidal_client_id = ""
# tidal_client_secret = ""

# Default stream quality when a client sends no bitrate or format hint:
# LOSSLESS | HIGH | LOW. The client's own hints still win.
# tidal_quality = "LOSSLESS"

# Blend the Tidal mixes (Daily Mix, My Mix, Discovery) into getPlaylists
# as read-only playlists.
show_mixes = true
