# Example settings. The real file lives at
#   $XDG_CONFIG_HOME/subtidal/settings.toml
# (or ~/.config/subtidal/settings.toml), or wherever you point to with
# `subtidal --config <path>`. APP_* env vars override individual values,
# eg. APP_PASSWORD=x.

username = "admin"
password = "admin"
port = 8000

# Exponential backoff on failed logins (2s, 4s, 8s, ... per client IP).
# Off by default: behind a reverse proxy every client shares one IP, so
# an attacker can lock out everyone.
rate_limit = false

# Optional: override the embedded Tidal app credentials.
# tidal_client_id = ""
# tidal_client_secret = ""

# Default stream quality when a client sends no bitrate or format hint:
# LOSSLESS | HIGH | LOW. The client's own hints still win.
# tidal_quality = "LOSSLESS"

# Blend the Tidal mixes (Daily Mix, My Mix, Discovery) into getPlaylists
# as read-only playlists.
show_mixes = true

# Serve word-synced lyrics (word/syllable-level timings with cueLine/cue). 
# This sends the song metadata (title, artist, isrc, duration, album) to a third-party API.
# Set to false to fall back to Tidal's built-in lyrics instead.
# word_synced_lyrics = true

# Optional scrobble backends. Both are best-effort: a failing reporter
# only logs, never fails the client request. When either block is present,
# getUser reports scrobblingEnabled=true.
#
# [lastfm]
# api_key = "..."
# api_secret = "..."
# # Authorization happens automatically on startup: the server prints a
# # URL, you authorize, and the session key is stored in the OS keychain.
# # Re-authorize later with `subtidal --lastfm-auth`.
#
# [listenbrainz]
# token = "..."
